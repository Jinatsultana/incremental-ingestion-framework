[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-ingestion-framework"
version = "1.0.0"
description = "Watermark-based incremental ingestion with tombstones and idempotent reruns"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
test = ["pytest>=8.0"]

[project.scripts]
ingest = "ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
